<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>copystroke</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #bec1c9;
        background-image: url('noise.png');
        background-size: auto
      }

      * {
        font-family: "Tiny5", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      h1, h3 {
        text-align: center;
        margin: 10px 0;
      }

      h1 {
        font-size: 2.5em;
      }

      #loadingMessage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        padding: 20px;
        max-width: 90%;
        width: 400px;
        text-align: center;
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black, 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
      }

      #loadingMessage p {
        font-size: 14px;
        line-height: 1.6;
        margin: 10px 0;
      }

      #loadingMessage .shortcuts {
        font-size: 12px;
        margin-top: 10px;
        color: #666;
      }

      #contentLoaded {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        padding: 20px;
        max-width: 90%;
        width: 400px;
        text-align: center;
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black, 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
      }

      button {
        color: #fff;
        padding: 10px 15px;
        margin: 15px 0;
        width: 256px;
        font-size: 16px;
        border: 0;
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black, 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
        cursor: pointer;
      }
      
      button:active:not(:disabled) {
        transform: translateY(5px);
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black,inset 0px 5px #00000038;
      }

      button:disabled {
        transform: none;
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black, 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
        background-color: #cccccc !important;
        color: #666666 !important;
        cursor: not-allowed;
      }

      #downloadBtn {
        background-color: #6abc3a;
      }

      #copyStrokeBtn {
        background-color: #6abc3a;
      }

      input[type="file"] {
        background-color: #f4f4f4;
        color: #333;
      }

      #imageContainer {
        width: 256px;
        height: 256px;
        display: flex;
        justify-content: center; 
        align-items: center;
        border: 5px dashed #000000;
        margin: 0 auto; 
        background-color: #f9f9f9;
        
      }

      .custom-file-label {
        display: inline-block;
        background-color: #007bff;
        color: #fff;
        padding: 10px 15px;
        margin: 15px 0;
        width: 226px;
        font-size: 16px;
        border: 0;
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black, 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
        cursor: pointer;
      }

      .custom-file-label:active {
        transform: translateY(5px);
        box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black,inset 0px 5px #00000038;
      }

      #downloadCanvasBtn {
        background-color: #073eb1;
      }

      #reverseStrokeBtn {
        background-color: #b13007;
      }

      #copyWithoutOverprintingBtn {
        background-color: #8a2be2;
      }

    </style>
  </head>
  <body>
    <div id="loadingMessage">
      <h1>COPYSTROKE</h1>
      <p>Loading...</p>
      <p style="margin-top: 20px;">If it takes too long to load, it's because this site uses a free proxy to fetch data from the API.</p>
      <p>Please try a few hard reloads until it loads:</p>
      <div class="shortcuts">
        <p><strong>Mac:</strong> Cmd + Shift + R</p>
        <p><strong>Windows:</strong> Ctrl + Shift + R</p>
      </div>
    </div>

    <div id="contentLoaded" style="display: none;">
      <h1>COPYSTROKE</h1>
      <h3 id="basepaintTheme">Loading...</h3>

      <button id="downloadBtn">Download Today Palette .png</button>
      <button id="downloadCanvasBtn">Download Canvas Progress</button>

      <div>
        <label for="loadImageBtn" class="custom-file-label">Load Image</label>
        <input type="file" id="loadImageBtn" accept="image/*" style="display: none;">
      </div>

      <div id="imageContainer"></div>

      <button id="copyStrokeBtn" disabled>Copy Stroke</button>
      <button id="copyWithoutOverprintingBtn" disabled>Copy Without Overprinting</button>
      <button id="reverseStrokeBtn">Reverse Stroke</button>
    </div>

    <script>
      let dayCanvas;
      let todayCanvas;

      setTitle();

      async function setTitle() {
        await fetchPalette();
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('basepaintTheme').textContent = `${dayCanvas} - ${todayCanvas.theme}`
        document.getElementById('contentLoaded').style.display = 'flex';
      }

      function getDay() {
        let startDate = Date.parse("2023-08-08T16:41:05Z");
        let today = new Date();
        let diffInMs = today - startDate;
        let diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));

        return diffInDays;
      }

      async function fetchPalette() {
        try {
          dayCanvas = getDay();
          const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://basepaint.xyz/api/theme/' + dayCanvas)}`);
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

          const data = await response.json();
          todayCanvas = JSON.parse(data.contents);

          console.log(todayCanvas);
        } catch (error) {
          console.error('Error fetching palette:', error);
        }
      }

      // Nueva función para obtener y procesar el canvas actual - SIEMPRE descarga fresco
      async function fetchCurrentCanvas() {
        try {
          console.log('Fetching fresh canvas data...');
          const dayCanvas = getDay();
          // Agregar timestamp para evitar caché del navegador
          const timestamp = new Date().getTime();
          const imageUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://basepaint.xyz/api/art/image?day=' + dayCanvas + '&scale=1&t=' + timestamp)}`;
          
          const response = await fetch(imageUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Error fetching current canvas: ${response.statusText}`);
          
          const blob = await response.blob();
          
          // Convertir blob a imagen
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              // Verificar que la imagen sea 256x256
              console.log(`Current canvas size: ${img.width}x${img.height}`);
              
              // Procesar la imagen para obtener los píxeles
              const pixels = processImageToMap(img);
              console.log(`Current canvas has ${pixels.size} pixels`);
              
              resolve(pixels);
            };
            img.onerror = () => reject(new Error('Error loading current canvas image'));
            img.src = URL.createObjectURL(blob);
          });
        } catch (error) {
          console.error('Error fetching current canvas:', error);
          return null;
        }
      }

      // Nueva función que procesa una imagen y devuelve un Map con key "x,y" -> colorIndex
      function processImageToMap(image) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Asegurarse de que el canvas sea siempre 256x256
        canvas.width = 256;
        canvas.height = 256;
        
        // Si la imagen no es 256x256, escalarla
        if (image.width !== 256 || image.height !== 256) {
          ctx.imageSmoothingEnabled = false; // Desactivar suavizado para pixel art
          ctx.drawImage(image, 0, 0, 256, 256);
        } else {
          ctx.drawImage(image, 0, 0);
        }

        const data = ctx.getImageData(0, 0, 256, 256).data;
        const pixelMap = new Map();

        for (let y = 0; y < 256; y++) {
          for (let x = 0; x < 256; x++) {
            const index = (y * 256 + x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const a = data[index + 3];

            // Ignorar píxeles transparentes o muy transparentes
            if (a < 128) {
              continue;
            }

            const color = getColorIndex(r, g, b);
            if (color !== -1) {
              pixelMap.set(`${x},${y}`, color);
            }
          }
        }

        return pixelMap;
      }

      function generatePaletteImage() {
        if (!todayCanvas || !todayCanvas.palette) {
          console.error("No palette data available.");
          return;
        }

        const colors = todayCanvas.palette;
        const squareSize = 50;
        const canvasWidth = colors.length * squareSize;
        const canvasHeight = squareSize;

        const canvas = document.createElement('canvas');
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        const ctx = canvas.getContext('2d');

        colors.forEach((color, index) => {
          ctx.fillStyle = color;
          ctx.fillRect(index * squareSize, 0, squareSize, squareSize);
        });
 
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${dayCanvas} - ${todayCanvas.theme}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 'image/png');
      }

      document.getElementById('downloadBtn').addEventListener('click', async () => {
        generatePaletteImage();
      });

      document.getElementById('downloadCanvasBtn').addEventListener('click', async () => {
        try {
          const dayCanvas = getDay();
          const imageUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://basepaint.xyz/api/art/image?day=' + dayCanvas + '&scale=1')}`;

          const response = await fetch(imageUrl);
          if (!response.ok) throw new Error(`Error fetching image: ${response.statusText}`);
          const blob = await response.blob();

          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `art-image-day-${dayCanvas}.png`;
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (error) {
          console.error('Error downloading the image:', error);
          alert('Failed to download the image. Please try again.');
        }
      });

      function validateImageSize(file) {
        return new Promise((resolve, reject) => {

          document.getElementById('copyStrokeBtn').disabled = true;
          document.getElementById('copyWithoutOverprintingBtn').disabled = true;
          document.getElementById('imageContainer').innerHTML = '';

          const img = new Image();
          img.onload = () => {
            if (img.width === 256 && img.height === 256) {
              resolve(img);
            } else {
              reject(new Error('The image must be 256x256px'));
            }
          };
          img.onerror = () => reject(new Error('Error loading image'));
          img.src = URL.createObjectURL(file);
        });
      }

      document.getElementById('loadImageBtn').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (file) {
          try {
            const img = await validateImageSize(file);
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.innerHTML = '';
            imageContainer.appendChild(img);
            document.getElementById('copyStrokeBtn').disabled = false;
            document.getElementById('copyWithoutOverprintingBtn').disabled = false;
          } catch (error) {
            alert(error.message);
          }
        }
      });

      // Función original que copia todos los píxeles
      function processImage(image) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = image.width;
        canvas.height = image.height;
        ctx.drawImage(image, 0, 0);

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        const resultado = [];

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const index = (y * canvas.width + x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const a = data[index + 3];

            if (a === 0) {
              continue;
            }

            const color = getColorIndex(r, g, b);
            if (color !== -1) {
              resultado.push({ "point": { "x": x, "y": y }, "color": color });
            }
          }
        }

        return JSON.stringify(resultado);
      }

      // Nueva función que procesa la imagen y filtra píxeles duplicados
      async function processImageWithFilter(image) {
        // SIEMPRE descargar el canvas actual fresco cada vez
        console.log('Downloading fresh current canvas for comparison...');
        const currentCanvasPixels = await fetchCurrentCanvas();
        
        if (!currentCanvasPixels) {
          console.error('Failed to fetch current canvas, proceeding without filtering');
          // Si falla, usar el método normal
          return processImage(image);
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = image.width;
        canvas.height = image.height;
        ctx.drawImage(image, 0, 0);

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        const resultado = [];
        let totalPixels = 0;
        let filteredPixels = 0;

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const index = (y * canvas.width + x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const a = data[index + 3];

            if (a === 0) {
              continue;
            }

            const color = getColorIndex(r, g, b);
            if (color !== -1) {
              totalPixels++;
              
              // Verificar si este píxel ya existe en el canvas actual con el mismo color
              const key = `${x},${y}`;
              const currentColor = currentCanvasPixels.get(key);
              
              // Solo agregar si el color es diferente o el píxel no existe en el canvas actual
              if (currentColor === undefined || currentColor !== color) {
                resultado.push({ "point": { "x": x, "y": y }, "color": color });
              } else {
                filteredPixels++;
              }
            }
          }
        }

        console.log(`Total pixels: ${totalPixels}, Filtered out: ${filteredPixels}, Remaining: ${resultado.length}`);
        return JSON.stringify(resultado);
      }

      function getColorIndex(r, g, b) {
        const toHex = (c) => {
          const hex = c.toString(16);
          return hex.length === 1 ? '0' + hex : hex;
        };
        const color = `#${toHex(r)}${toHex(g)}${toHex(b)}`.toLowerCase();
        const index = todayCanvas.palette.findIndex(p => p.toLowerCase() === color);
        return index;
      }

      function copyToClipboard(texto) {
        navigator.clipboard.writeText(texto).then(() => {
          console.log('Text copied to clipboard');
        });
      }

      // Botón original Copy Stroke
      document.getElementById('copyStrokeBtn').addEventListener('click', async () => {
        const image = document.getElementById('imageContainer').children[0];
        const arrayPixels = processImage(image);
        copyToClipboard(arrayPixels);
      });

      // Nuevo botón Copy Without Overprinting
      document.getElementById('copyWithoutOverprintingBtn').addEventListener('click', async () => {
        const button = document.getElementById('copyWithoutOverprintingBtn');
        const originalText = button.textContent;
        
        try {
          button.disabled = true;
          button.textContent = 'Downloading Canvas...';
          
          const image = document.getElementById('imageContainer').children[0];
          const arrayPixels = await processImageWithFilter(image);
          
          copyToClipboard(arrayPixels);
          
          button.textContent = 'Copied!';
          setTimeout(() => {
            button.textContent = originalText;
            button.disabled = false;
          }, 2000);
        } catch (error) {
          console.error('Error processing image:', error);
          alert('Error processing image. Please try again.');
          button.textContent = originalText;
          button.disabled = false;
        }
      });

      async function reverseStroke() {
        try {
          const clipboardText = await navigator.clipboard.readText();
          
          if (!clipboardText) {
            alert('No hay contenido en el portapapeles');
            return;
          }

          let pixelData;
          try {
            pixelData = JSON.parse(clipboardText);
          } catch (error) {
            alert('El contenido del portapapeles no es un JSON válido');
            return;
          }

          if (!Array.isArray(pixelData)) {
            alert('El formato de datos no es válido');
            return;
          }

          if (!todayCanvas || !todayCanvas.palette) {
            alert('No se ha cargado la paleta de colores');
            return;
          }

          const canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');

          ctx.clearRect(0, 0, 256, 256);

          pixelData.forEach(pixel => {
            if (pixel.point && typeof pixel.color === 'number') {
              const x = pixel.point.x;
              const y = pixel.point.y;
              const colorIndex = pixel.color;

              if (x >= 0 && x < 256 && y >= 0 && y < 256 && colorIndex >= 0 && colorIndex < todayCanvas.palette.length) {
                ctx.fillStyle = todayCanvas.palette[colorIndex];
                ctx.fillRect(x, y, 1, 1);
              }
            }
          });

          canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `reverse-stroke-${dayCanvas}-${todayCanvas.theme}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 'image/png');

        } catch (error) {
          console.error('Error en reverse stroke:', error);
          alert('Error al procesar el reverse stroke: ' + error.message);
        }
      }

      document.getElementById('reverseStrokeBtn').addEventListener('click', reverseStroke);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js')
            .then(registration => {
              console.log('Service Worker successfully registered:', registration);
            })
            .catch(error => {
              console.log('Error registering Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
